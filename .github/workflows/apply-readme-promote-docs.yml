name: Apply README promote docs patch

on:
  push:
    paths:
      - .github/workflows/apply-readme-promote-docs.yml

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch README files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = replace_once(
              text,
              """PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import process-inbox\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import review external_pack\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import stats""",
              """PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import process-inbox\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import review external_pack\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import promote external_pack --accept-import --applies-to backend,frontend_components\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import stats""",
              'README import command block',
          )
          text = replace_once(
              text,
              """`state/<session>.summary.md`, and `ledger/pending/`. It still does not install\nor trust the imported content automatically.\n\nThe import command records source kind, origin path, optional local copy,""",
              """`state/<session>.summary.md`, and `ledger/pending/`. It still does not install\nor trust the imported content automatically.\n\n`import promote <source_id> --accept-import` is the accepted-provenance step.\nIt writes reviewed skill metadata into `pgsa/skills/signed_skill_manifest.yaml`\nand marks the import accepted. It still does not install global skills, execute\nimported code, or copy raw external instructions into the shipped `protocol/`\nfolders.\n\nUse `--applies-to` to make accepted provenance available to later sessions. For\nexample, one imported package can be approved for `backend`,\n`frontend_components`, and `docs_security_integration` without giving it global\nauthority over the project.\n\nThe import command records source kind, origin path, optional local copy,""",
              'README promote explanation',
          )
          text = replace_once(
              text,
              """4. Run `pgsa import review <source_id>` or have the session write the same\n   review artifacts manually.\n5. Promote only accepted material into contracts, summaries, roles, capability\n   manifests, `pgsa/skills/`, merge proposals, or ledger events.\n\nImported content is source material, not trusted project guidance. This keeps\nexternal skills from silently changing the project contract or overriding\ncurrent PGSA state.\n\nTo run a real external import verification against public skill sources:""",
              """4. Run `pgsa import review <source_id>` or have the session write the same\n   review artifacts manually.\n5. Run `pgsa import promote <source_id> --accept-import --applies-to <sessions>` when accepted skill\n   provenance should enter `pgsa/skills/signed_skill_manifest.yaml`.\n6. Promote only accepted material into contracts, summaries, roles, capability\n   manifests, `pgsa/skills/`, merge proposals, or ledger events.\n\nImported content is source material, not trusted project guidance. This keeps\nexternal skills from silently changing the project contract or overriding\ncurrent PGSA state.\n\nDedicated import-review configuration:\n\n- `pgsa/sessions.yaml` includes `external_import_review` by default.\n- `pgsa/harness/external_import_review.md` is generated at init time as the\n  session operating file.\n- `protocol/imports/external_import_review_agent.md` contains the launch prompt\n  and step-by-step review workflow.\n- `protocol/roles/examples/external-import-review.role.yaml` is the role\n  example for custom projects that want a stronger import-review role file.\n\nTo run a real external import verification against public skill sources:""",
              'README flow and config block',
          )
          text = replace_once(
              text,
              """| Imported material could be referenced by convention. | Imported packages are copied, indexed, reviewed, summarized, and recorded in pending ledger events before promotion. |""",
              """| Imported material could be referenced by convention. | Imported packages are copied, indexed, reviewed, summarized, promoted into accepted skill provenance when approved, and recorded in pending ledger events before project activation. |""",
              'README v1.2 table row',
          )
          text = replace_once(
              text,
              """-> review artifacts + ledger/pending/\n-> accepted promotion into pgsa/skills, contracts, roles, capabilities, or ledger""",
              """-> review artifacts + ledger/pending/\n-> pgsa import promote <source_id> --accept-import --applies-to <sessions>\n-> accepted provenance in pgsa/skills/signed_skill_manifest.yaml\n-> optional promotion into contracts, roles, capabilities, or ledger""",
              'README v1.2 flow',
          )
          readme.write_text(text, encoding='utf-8')

          zh = Path('README.zh-CN.md')
          text = zh.read_text(encoding='utf-8')
          text = replace_once(
              text,
              """-> review artifacts + ledger/pending/\n-> accepted promotion into pgsa/skills, contracts, roles, capabilities, or ledger""",
              """-> review artifacts + ledger/pending/\n-> pgsa import promote <source_id> --accept-import --applies-to <sessions>\n-> accepted provenance in pgsa/skills/signed_skill_manifest.yaml\n-> optional promotion into contracts, roles, capabilities, or ledger""",
              'CN v1.2 flow',
          )
          text = replace_once(
              text,
              """PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import process-inbox\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import review external_pack\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import stats""",
              """PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import process-inbox\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import review external_pack\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import promote external_pack --accept-import --applies-to backend,frontend_components\nPYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . import stats""",
              'CN import command block',
          )
          text = replace_once(
              text,
              """`import review <source_id>` 会扫描复制后的来源，识别 `SKILL.md`、README 和 schema 文件，把 import 记录更新为 `reviewed`，并把审查结果写入 `harness/<session>.md`、`state/<session>.summary.md` 和 `ledger/pending/`。这仍然不会自动安装或信任外部内容。\n\n要运行真实外部导入验证：""",
              """`import review <source_id>` 会扫描复制后的来源，识别 `SKILL.md`、README 和 schema 文件，把 import 记录更新为 `reviewed`，并把审查结果写入 `harness/<session>.md`、`state/<session>.summary.md` 和 `ledger/pending/`。这仍然不会自动安装或信任外部内容。\n\n`import promote <source_id> --accept-import` 是 accepted provenance 步骤。它会把已审查 skill metadata 写入 `pgsa/skills/signed_skill_manifest.yaml`，并把 import 标记为 accepted。它仍然不会安装全局 skills、执行外部代码，也不会把 raw external instructions 直接复制进随仓库发布的 `protocol/`。\n\n使用 `--applies-to` 可以声明这份 accepted provenance 后续允许哪些 PGSA sessions 使用。例如同一个外部 package 可以被批准给 `backend`、`frontend_components` 或 `docs_security_integration` 使用，但不会获得整个项目的全局权威。\n\n专门的 import-review 配置：\n\n- `pgsa/sessions.yaml` 默认包含 `external_import_review`。\n- `pgsa/harness/external_import_review.md` 会在 init 时生成，作为这个 session 的操作文件。\n- `protocol/imports/external_import_review_agent.md` 包含启动 prompt 和逐步 review workflow。\n- `protocol/roles/examples/external-import-review.role.yaml` 是需要更强 role 文件时可复用的示例。\n\n要运行真实外部导入验证：""",
              'CN promote explanation',
          )
          text = replace_once(
              text,
              """| 外部材料主要靠约定引用。 | 外部 packages 先复制、索引、审查、总结，并写入 pending ledger events 后才允许提升。 |""",
              """| 外部材料主要靠约定引用。 | 外部 packages 先复制、索引、审查、总结；通过 `import promote` 写入 accepted skill provenance 后，才允许进入项目状态。 |""",
              'CN v1.2 table row',
          )
          zh.write_text(text, encoding='utf-8')
          PY
      - name: Commit README patch
        run: |
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "README files already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "Document import promotion flow in README"
          git push
