name: apply-session-agent-folders

on:
  push:
    paths:
      - .github/workflows/apply-session-agent-folders.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply generated patch
        run: |
          cat > /tmp/pgsa-session-agent.patch.b64 <<'B64'

B64
          base64 -d /tmp/pgsa-session-agent.patch.b64 > /tmp/pgsa-session-agent.patch
          git apply /tmp/pgsa-session-agent.patch
          git rm .github/workflows/apply-session-agent-folders.yml
          git add README.md README.zh-CN.md protocol/SKILL.md protocol/artifact-map.md protocol/session-agents/README.md tools/python/pgsa_cli/main.py tools/python/pgsa_cli/session_agent_shim.py tools/python/tests/test_session_agent_shim.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add PGSA session agent folders"
          git push
          echo "trigger: second push"
