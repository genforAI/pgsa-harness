name: finalize-session-agent-docs

on:
  push:
    paths:
      - .github/workflows/apply-session-agent-folders.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch README session-agent docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              '--must-read imports/index.json,imports/sources/external_pack/ \\\n',
              '--must-read imports/index.json,imports/sources/ \\\n',
          )
          if '### Session Agent Folders' not in text:
              marker = (
                  'This creates the `sessions.yaml` entry plus matching `harness/` and `state/`\n'
                  'files. The new session still has explicit scope and required artifacts; it does\n'
                  'not receive global authority over the repo.\n\n'
              )
              section = '''### Session Agent Folders

The registry is still `pgsa/sessions.yaml`. A session agent folder is only a
launch wrapper for a fresh Codex, Claude Code, SDK, or external-agent session.
It gives that session its own `AGENTS.md` / `SKILL.md` while pointing back to the
same PGSA root, harness root, required reads, required updates, and accepted
skill manifest.

Default embedded layout:

```bash
PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . session-agent create backend
```

This writes:

```text
pgsa/session_agents/backend/
  AGENTS.md
  SKILL.md
  PGSA_SESSION.json
```

For a sibling long-running session folder or separate worktree:

```bash
PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root target-project \
  session-agent create backend \
  --out ../agent-sessions/backend \
  --harness-root ../pgsa-harness
```

The generated `PGSA_SESSION.json` stores relative pointers to `pgsa_root`,
`harness_root`, `sessions.yaml`, `harness/<session>.md`,
`state/<session>.summary.md`, and `skills/signed_skill_manifest.yaml`.

Accepted external skills are reusable across sessions through
`pgsa/skills/signed_skill_manifest.yaml`: a session should use only entries
whose `applies_to` contains that session id or `*`. Raw
`pgsa/imports/sources/<source_id>/` content remains review material, not active
guidance, unless the session is `external_import_review` or the source is
explicitly listed in `must_read`.

'''
              if marker not in text:
                  raise SystemExit('README insertion marker not found')
              text = text.replace(marker, marker + section)
          text = text.replace(
              '3. Let that session read `imports/index.json` and `imports/sources/<source_id>/.`',
              '3. Let that session read `imports/index.json` and the reviewed\n   `imports/sources/<source_id>/.`',
          )
          text = text.replace(
              '3. Let that session read `imports/index.json` and `imports/sources/<source_id>/`.',
              '3. Let that session read `imports/index.json` and the reviewed\n   `imports/sources/<source_id>/`.',
          )
          readme.write_text(text)

          cn = Path('README.zh-CN.md')
          text = cn.read_text()
          text = text.replace(
              '--must-read imports/index.json,imports/sources/external_pack/ \\\n',
              '--must-read imports/index.json,imports/sources/ \\\n',
          )
          if '### Session Agent 文件夹' not in text:
              marker = (
                  '  --handoff-to docs_security_integration \\\n'
                  '  --self-registered\n'
                  '```\n\n'
              )
              section = '''### Session Agent 文件夹

真正的注册表仍然是 `pgsa/sessions.yaml`。Session agent 文件夹只是给一个新开的
Codex、Claude Code、SDK 或外部 agent session 使用的启动包装器：它给这个 session
一个自己的 `AGENTS.md` / `SKILL.md`，同时指回同一份 PGSA root、harness root、
required reads、required updates 和 accepted skill manifest。

默认内嵌布局：

```bash
PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root . session-agent create backend
```

这会写入：

```text
pgsa/session_agents/backend/
  AGENTS.md
  SKILL.md
  PGSA_SESSION.json
```

如果每个长时间运行的 session 有自己的 sibling 文件夹或 worktree：

```bash
PYTHONPATH=pgsa-harness/tools/python python3 -m pgsa_cli.main --root target-project \
  session-agent create backend \
  --out ../agent-sessions/backend \
  --harness-root ../pgsa-harness
```

生成的 `PGSA_SESSION.json` 会保存指向 `pgsa_root`、`harness_root`、
`sessions.yaml`、`harness/<session>.md`、`state/<session>.summary.md` 和
`skills/signed_skill_manifest.yaml` 的相对路径。

已接受的外部 skills 通过 `pgsa/skills/signed_skill_manifest.yaml` 被多个 session
复用：session 只能使用 `applies_to` 包含自己 session id 或 `*` 的条目。Raw
`pgsa/imports/sources/<source_id>/` 仍然是 review material，不是 active guidance；
除非当前 session 是 `external_import_review`，或者这个 source 被显式写进该
session 的 `must_read`。

'''
              if marker not in text:
                  raise SystemExit('README.zh-CN insertion marker not found')
              text = text.replace(marker, marker + section)
          cn.write_text(text)
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/apply-session-agent-folders.yml
      - name: Verify
        run: |
          PYTHONPATH=tools/python python3 -m unittest discover -s tools/python/tests -t tools/python
          find tools/python -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 tools/scripts/validate_release.py --root .
          PYTHONPATH=tools/python python3 -m pgsa_cli.main --root examples/teamtask-projectboard validate --strict-advanced
      - name: Commit final docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md .github/workflows/apply-session-agent-folders.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Finalize PGSA session agent documentation"
            git push
          fi
