name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -t .
      - run: python3 -m pgsa_cli.main --root examples/teamtask-projectboard validate
      - run: python3 -m pgsa_cli.main --root examples/teamtask-projectboard drift-report
