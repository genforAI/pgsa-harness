name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -e tools/python
      - run: python3 -m unittest discover -s tools/python/tests -t tools/python
      - run: pgsa --root examples/teamtask-projectboard validate
      - run: pgsa --root examples/teamtask-projectboard drift-report
      - run: python3 tools/scripts/validate_release.py --root .