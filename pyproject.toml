[project]
name = "pgsa-harness"
version = "0.1.0"
description = "Repo-local project-coherence harness for coding-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PGSA Harness"}]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
pgsa = "pgsa_cli.main:main"
